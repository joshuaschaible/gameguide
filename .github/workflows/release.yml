# Ships every push to main. When the Tests workflow passes on a push to main
# (Linux, Windows and macOS), this builds the Windows and Mac apps and publishes
# a GitHub release; installed copies update themselves within minutes.
#
# scripts/release-plan.mjs decides (run it locally to see what would happen):
#  - version: next patch after the latest release (1.13.0 -> 1.13.1 ...);
#    bump app/package.json above it to start a new line (1.14.0)
#  - skipped when only docs/tests/CI changed, or a newer push is on its way
# Failing tests never ship. "Run workflow" (by hand) still works.
#
# Secrets (Settings > Secrets and variables > Actions):
#   MAC_SIGN_CERT  contents of gameguide-signing.crt  (homemade Mac certificate)
#   MAC_SIGN_KEY   contents of gameguide-signing.key
# Without them the Mac build is still made, with a throwaway (ad hoc) signature.
name: Release

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; a newer push waits for the one in progress.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    # Only a green test run of a push to main (never a pull request), or a manual run.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide version (or skip)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/release-plan.mjs

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: macos-15
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: npm ci --no-audit --no-fund
      - name: Install app dependencies
        working-directory: app
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Stamp version ${{ needs.plan.outputs.version }}
        working-directory: app
        run: npm version ${{ needs.plan.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Check hidden updater helper (Windows)
        if: matrix.platform == 'win32'
        run: node scripts/check-windows.cjs
      - name: Package
        run: node scripts/package.mjs ${{ matrix.platform }}
      - name: Read name and version
        id: meta
        shell: bash
        run: |
          echo "name=$(node -p "require('./app/brand.json').name")" >> "$GITHUB_OUTPUT"
          echo "prefix=$(node -p "require('./app/brand.json').name.replace(/\\s+/g,'-')")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sign (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          MAC_SIGN_CERT: ${{ secrets.MAC_SIGN_CERT }}
          MAC_SIGN_KEY: ${{ secrets.MAC_SIGN_KEY }}
        run: |
          APP="dist/${{ steps.meta.outputs.name }}-darwin-arm64/${{ steps.meta.outputs.name }}.app"
          if [ -n "$MAC_SIGN_CERT" ] && [ -n "$MAC_SIGN_KEY" ]; then
            curl -sSL -o rc.tgz https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-macos-universal.tar.gz
            tar xzf rc.tgz
            RC=$(find . -name rcodesign -type f | head -1)
            printf '%s' "$MAC_SIGN_CERT" > cert.pem
            printf '%s' "$MAC_SIGN_KEY" > key.pem
            "$RC" sign --timestamp-url none --pem-file cert.pem --pem-file key.pem "$APP"
            rm -f cert.pem key.pem
          else
            codesign --force --deep --sign - "$APP"
          fi
          mkdir -p release
          ditto -c -k --keepParent "$APP" "release/${{ steps.meta.outputs.prefix }}-Mac-v${{ steps.meta.outputs.version }}.zip"

      - name: Zip (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $name = "${{ steps.meta.outputs.name }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Rename-Item "dist/$name-win32-x64" "$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "release/${{ steps.meta.outputs.prefix }}-Windows-v${{ steps.meta.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: release/*.zip

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          NAME=$(node -p "require('./app/brand.json').name")
          gh release create "v$VERSION" release/*.zip --target "$SHA" --title "$NAME v$VERSION" --generate-notes
