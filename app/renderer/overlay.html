<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>overlay</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
    #toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(13, 15, 20, 0.85); color: #eef1f7; padding: 8px 16px; border-radius: 10px;
      font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #toast.on { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="toast"></div>
  <script src="marks.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
